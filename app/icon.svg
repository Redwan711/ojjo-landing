<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Strawberry Body Gradient -->
    <radialGradient id="berryGrad" cx="35%" cy="32%" r="65%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3b65" />
      <stop offset="45%" stop-color="#e4002b" />
      <stop offset="85%" stop-color="#9e0024" />
      <stop offset="100%" stop-color="#5a0014" />
    </radialGradient>

    <!-- Green Leaves Gradient -->
    <linearGradient id="leafGrad" x1="20" y1="6" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="40%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="31" y1="4" x2="36" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>

    <!-- 3D Specular Highlight -->
    <linearGradient id="shineGrad" x1="18" y1="20" x2="26" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="2" y="2" width="60" height="62" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3a0515" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Strawberry Berry Body -->
    <path d="M32 60C30 60 11 48 11 32C11 18.5 20.5 15 32 15C43.5 15 53 18.5 53 32C53 48 34 60 32 60Z" 
          fill="url(#berryGrad)" />

    <!-- 3D Surface Highlight -->
    <path d="M15 28C14 36 18 45 23 50C19 44 17 36 18 28C19 23 23 18 28 17C21 18 16 22 15 28Z" 
          fill="url(#shineGrad)" />
    <ellipse cx="23" cy="24" rx="4" ry="7" transform="rotate(-25 23 24)" fill="url(#shineGrad)" />

    <!-- Golden Strawberry Seeds -->
    <!-- Row 1 -->
    <ellipse cx="25" cy="22" rx="1.1" ry="1.9" transform="rotate(-15 25 22)" fill="#ffd166" />
    <ellipse cx="32" cy="21" rx="1.1" ry="1.9" fill="#ffd166" />
    <ellipse cx="39" cy="22" rx="1.1" ry="1.9" transform="rotate(15 39 22)" fill="#ffd166" />

    <!-- Row 2 -->
    <ellipse cx="19" cy="29" rx="1.2" ry="2.0" transform="rotate(-25 19 29)" fill="#ffd166" />
    <ellipse cx="26" cy="29" rx="1.2" ry="2.0" transform="rotate(-10 26 29)" fill="#ffd166" />
    <ellipse cx="33" cy="28" rx="1.2" ry="2.0" fill="#ffd166" />
    <ellipse cx="40" cy="29" rx="1.2" ry="2.0" transform="rotate(10 40 29)" fill="#ffd166" />
    <ellipse cx="46" cy="29" rx="1.2" ry="2.0" transform="rotate(25 46 29)" fill="#ffd166" />

    <!-- Row 3 -->
    <ellipse cx="21" cy="37" rx="1.2" ry="2.0" transform="rotate(-20 21 37)" fill="#ffd166" />
    <ellipse cx="28" cy="36" rx="1.2" ry="2.0" transform="rotate(-8 28 36)" fill="#ffd166" />
    <ellipse cx="35" cy="36" rx="1.2" ry="2.0" transform="rotate(8 35 36)" fill="#ffd166" />
    <ellipse cx="42" cy="37" rx="1.2" ry="2.0" transform="rotate(20 42 37)" fill="#ffd166" />

    <!-- Row 4 -->
    <ellipse cx="24" cy="44" rx="1.1" ry="1.9" transform="rotate(-15 24 44)" fill="#ffd166" />
    <ellipse cx="31" cy="44" rx="1.1" ry="1.9" transform="rotate(-5 31 44)" fill="#ffd166" />
    <ellipse cx="38" cy="44" rx="1.1" ry="1.9" transform="rotate(12 38 44)" fill="#ffd166" />

    <!-- Row 5 -->
    <ellipse cx="28" cy="51" rx="1" ry="1.7" transform="rotate(-10 28 51)" fill="#ffd166" />
    <ellipse cx="34" cy="51" rx="1" ry="1.7" transform="rotate(10 34 51)" fill="#ffd166" />

    <!-- Bottom seed -->
    <ellipse cx="31.5" cy="56" rx="0.9" ry="1.5" fill="#ffd166" />

    <!-- Stem -->
    <path d="M32 17C31.5 12 33 6 39 4C37 8 35 13 33.5 17Z" 
          fill="url(#stemGrad)" />

    <!-- Calyx (Green Leaves) -->
    <!-- Left outer leaf -->
    <path d="M32 16C26 15 15 13 14 19C17 22 25 19 32 16Z" fill="url(#leafGrad)" />
    <!-- Left mid leaf -->
    <path d="M32 16C28 14 21 18 20 25C24 23 29 19 32 16Z" fill="url(#leafGrad)" />
    <!-- Center leaf -->
    <path d="M32 16C31 19 29 25 32 27C34 25 33 19 32 16Z" fill="url(#leafGrad)" />
    <!-- Right mid leaf -->
    <path d="M32 16C35 14 42 18 43 25C40 23 35 19 32 16Z" fill="url(#leafGrad)" />
    <!-- Right outer leaf -->
    <path d="M32 16C38 15 49 13 50 19C47 22 39 19 32 16Z" fill="url(#leafGrad)" />
  </g>
</svg>
